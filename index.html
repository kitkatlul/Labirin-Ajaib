<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Misi Penyelamatan di Labirin Ajaib</title><link rel="stylesheet" href="style.css"></head><body>
<div id="app"><div id="main">
<header id="hud"><span id="ltitle"></span><span class="hb"><button id="help" class="icon" aria-label="Bantuan"><svg viewBox="0 0 24 24"><path d="M8.5 9a3.5 3.5 0 117 0c0 2.5-3.5 2.800-3.500 5.500" fill="none" stroke="#4a2c10" stroke-width="2.800" stroke-linecap="round"/><circle cx="12" cy="19" r="1.800" fill="#4a2c10"/></svg></button><button id="gear" class="icon" aria-label="Pengaturan suara"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5" fill="none" stroke="#4a2c10" stroke-width="2.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M19 5l-3 3M8 16l-3 3" stroke="#4a2c10" stroke-width="2.5" stroke-linecap="round"/></svg></button>
<button id="snd" class="icon" aria-label="Suara"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9z" fill="#4a2c10"/><path id="wave" d="M15 8a5 5 0 010 8M18 5a9 9 0 010 14" stroke="#4a2c10" stroke-width="2" fill="none"/><path id="slash" d="M3 3l18 18" stroke="#e53935" stroke-width="3"/></svg></button></span></header>
<div id="view"><canvas id="cv"></canvas>
<div id="boss" class="hidden"><div id="bh"></div><div id="bmon"><img alt="Monster Penjaga"></div>
<div id="bpanel"><div id="bt"></div><div id="bq"></div></div><div id="bf"></div><button id="bnext" class="btn hidden"></button></div></div></div>
<div id="dpad"><button data-d="up" style="grid-area:1/2" aria-label="Atas"><svg viewBox="0 0 24 24"><path d="M12 5l8 12H4z" fill="#5b3a1e"/></svg></button>
<button data-d="left" style="grid-area:2/1" aria-label="Kiri"><svg viewBox="0 0 24 24"><path d="M12 5l8 12H4z" fill="#5b3a1e"/></svg></button>
<button data-d="right" style="grid-area:2/3" aria-label="Kanan"><svg viewBox="0 0 24 24"><path d="M12 5l8 12H4z" fill="#5b3a1e"/></svg></button>
<button data-d="down" style="grid-area:3/2" aria-label="Bawah"><svg viewBox="0 0 24 24"><path d="M12 5l8 12H4z" fill="#5b3a1e"/></svg></button></div></div>
<div id="start" class="ov"><div class="card"><h1>Misi Penyelamatan<br>di Labirin Ajaib</h1><div id="cast"></div><p id="firstmsg" class="tiny hidden">Pertama kali main? Ikuti ceritanya dulu, ya!</p>
<div id="menu">
<button id="mStart" class="btn mbtn"><svg class="ar" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="#4a2c10"/></svg><span>Mulai Petualangan</span></button>
<button id="mQuick" class="btn mbtn"><svg class="ar" viewBox="0 0 24 24"><path d="M3 5l9 7-9 7zM12 5l9 7-9 7z" fill="#4a2c10"/></svg><span>Langsung Bermain</span></button>
<button id="mStory" class="btn mbtn sec"><svg class="ar" viewBox="0 0 24 24"><path d="M4 5h7a2 2 0 012 2v12a2 2 0 00-2-2H4zM20 5h-7v14a2 2 0 012-2h5z" fill="#4a2c10"/></svg><span>Lihat Cerita</span></button>
<button id="mHow" class="btn mbtn sec"><svg class="ar" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#4a2c10" stroke-width="2.500"/><path d="M9.500 9.500a2.500 2.500 0 115 0c0 1.800-2.500 2-2.500 4" fill="none" stroke="#4a2c10" stroke-width="2.200" stroke-linecap="round"/><circle cx="12" cy="17" r="1.300" fill="#4a2c10"/></svg><span>Cara Bermain</span></button>
<button id="mSet" class="btn mbtn sec"><svg class="ar" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9z" fill="#4a2c10"/><path d="M15 8a5 5 0 010 8M18 5a9 9 0 010 14" stroke="#4a2c10" stroke-width="2" fill="none"/></svg><span>Pengaturan Suara</span></button></div></div></div>
<div id="story" class="ov hidden"><button id="sskip" class="btn small skip hidden"><span>Lewati Cerita</span><svg class="ar" viewBox="0 0 24 24"><path d="M4 5l9 7-9 7zM14 5l7 7-7 7z" fill="#4a2c10"/></svg></button><div class="scard"><div id="sdots"></div><canvas id="scv" width="320" height="192"></canvas><p id="scap"></p>
<div class="row"><button id="sspk" class="icon big" aria-label="Ulangi suara"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9z" fill="#4a2c10"/><path d="M15 8a5 5 0 010 8M18 5a9 9 0 010 14" stroke="#4a2c10" stroke-width="2" fill="none"/></svg></button><button id="snext" class="btn"></button></div></div></div>
<div id="intro" class="ov hidden"><div class="card"><h2 id="itl"></h2><div id="ictl"><span class="key">&#9650;</span><span class="key">&#9664;</span><span class="key">&#9660;</span><span class="key">&#9654;</span><p>Tombol panah / W A S D / D-pad</p></div>
<div class="row"><button id="iskip" class="btn small skip2"><span>Lewati Petunjuk</span><svg class="ar" viewBox="0 0 24 24"><path d="M4 5l9 7-9 7zM14 5l7 7-7 7z" fill="#4a2c10"/></svg></button></div><div class="row"><button id="ispk" class="icon big" aria-label="Ulangi suara"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9z" fill="#4a2c10"/><path d="M15 8a5 5 0 010 8M18 5a9 9 0 010 14" stroke="#4a2c10" stroke-width="2" fill="none"/></svg></button><button id="inext" class="btn"></button></div></div></div>
<div id="quiz" class="ov hidden"><div class="card"><div id="qdots"></div><h2 id="qtext"></h2><button id="qsay" class="btn small" aria-label="Dengar lagi"><svg viewBox="0 0 24 24" class="ar"><path d="M3 9v6h4l5 4V5L7 9z" fill="#4a2c10"/><path d="M15 8a5 5 0 010 8M18 5a9 9 0 010 14" stroke="#4a2c10" stroke-width="2" fill="none"/></svg><span>Dengar lagi</span></button><div id="qvis"></div><div id="qch"></div><div id="qpraise" class="hidden"></div><button id="qnext" class="btn hidden"></button></div></div>
<div id="reward" class="ov hidden"><div class="card"><h1 id="rt"></h1><p id="rs"></p><div id="stars"></div><button id="rb" class="btn"></button></div></div>
<div id="set" class="ov hidden"><div class="card"><h2>Pengaturan Suara</h2><label>Musik <input type="range" id="vm" min="0" max="1" step=".05"></label><label>Suara narator <input type="range" id="vv" min="0" max="1" step=".05"></label><label>Efek suara <input type="range" id="vs" min="0" max="1" step=".05"></label><button id="sclose" class="btn small">Selesai</button></div></div>
<div id="how" class="ov hidden"><div class="card"><h2>Cara Bermain</h2><div id="ictl2"><span class="key">&#9650;</span><span class="key">&#9664;</span><span class="key">&#9660;</span><span class="key">&#9654;</span><p>Tombol panah / W A S D / D-pad</p></div><ul id="hsteps"></ul><div class="row"><button id="hspk" class="icon big" aria-label="Ulangi suara"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9z" fill="#4a2c10"/><path d="M15 8a5 5 0 010 8M18 5a9 9 0 010 14" stroke="#4a2c10" stroke-width="2" fill="none"/></svg></button><button id="hclose" class="btn">Tutup</button></div></div></div>
<div id="helpm" class="ov hidden"><div class="card"><h2>Bantuan</h2><div class="hcol"><button id="hAgain" class="btn mbtn sec"><svg class="ar" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9z" fill="#4a2c10"/><path d="M15 8a5 5 0 010 8M18 5a9 9 0 010 14" stroke="#4a2c10" stroke-width="2" fill="none"/></svg><span>Dengar Petunjuk</span></button><button id="hThink" class="btn mbtn sec"><svg class="ar" viewBox="0 0 24 24"><circle cx="12" cy="10" r="6" fill="none" stroke="#4a2c10" stroke-width="2.500"/><path d="M9.500 18h5M10 21h4" stroke="#4a2c10" stroke-width="2.500" stroke-linecap="round"/></svg><span>Bantu Aku Berpikir</span></button><button id="hClose" class="btn mbtn"><span>Tutup</span></button></div></div></div>
<div id="fade"></div>
<script src="src/config.js"></script><script src="src/data.js"></script><script src="src/mazes.js"></script><script src="src/voice-lines.js"></script><script src="src/storage.js"></script><script src="src/sprites.js"></script><script src="src/questions.js"></script><script src="src/audio.js"></script><script src="src/voice.js"></script><script src="src/scenes.js"></script><script src="src/game.js"></script>
</body></html>
